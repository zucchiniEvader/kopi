name: Release

# Push a tag of the version in mygo.json, as v0.2.0, to build the apps of
# every platform into a draft release, which you publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          version="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version of mygo.json, $version" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Kopi ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS; MyGo needs no cgo, so Ubuntu builds the
          # others.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The Developer ID certificate, a .p12 in base64, and the Apple ID
      # notarytool submits with, as electron-builder takes them: the app is
      # signed and its disk image notarized, which Gatekeeper opens on any
      # Mac. Without them, the app is signed ad hoc, as on a build at home.
      - name: Sign and notarize, with the certificate of the secrets
        if: matrix.name == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No CSC_LINK secret: the app is signed ad hoc, and Gatekeeper blocks it"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Apple's intermediate authorities, of either generation, without
          # which the certificate is no valid identity.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "No valid Developer ID Application identity in CSC_LINK. The keychain holds:" >&2
            security find-identity -p codesigning "$keychain" >&2
            security find-certificate -a "$keychain" | grep '"labl"' >&2 || true
            exit 1
          fi
          echo "Signing as $identity"
          xcrun notarytool store-credentials kopi-notary --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$keychain"
          jq --arg identity "$identity" --arg keychain "$keychain" \
            '.macos.signingIdentity = $identity | .macos.notarize = {keychainProfile: "kopi-notary", keychain: $keychain}' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      # The key that signs the updates, which the app installs: without
      # it, mygo builds no updates.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::warning::No MYGO_UPDATER_PRIVATE_KEY secret: the release has no updates"
          fi
          go tool mygo build -platform "${{ matrix.platform }}"
      - name: Check the signature and the notarization
        if: matrix.name == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then exit 0; fi
          for dmg in build/*/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          done
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Each file says its platform and architecture: the Windows
          # installers of amd64 and arm64 are otherwise named alike.
          shopt -s nullglob
          version="$(jq -r .version mygo.json)"
          mkdir -p dist
          for dir in build/*/; do
            target="$(basename "$dir")" # as windows-amd64
            for f in "$dir"*.dmg; do cp "$f" "dist/Kopi-$version-macos-${target#darwin-}.dmg"; done
            for f in "$dir"*Setup*.exe; do cp "$f" "dist/Kopi-$version-$target-setup.exe"; done
            # The updates keep their names, which their manifests give.
            for f in "$dir"*.deb "$dir"*.tar.gz "$dir"*.delta "$dir"update-*.json "$dir"install.sh; do cp "$f" dist/; done
          done
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing was built" >&2
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
